backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "website_content"
    label: "Website Content"
    delete: false
    editor:
      preview: false
    files:
      - file: "data/news.json"
        label: "News Feed"
        name: "news"
        fields:
          - name: "news_items"
            label: "News Items"
            label_singular: "News Item"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Publish Date Label", name: "date", widget: "string", placeholder: "e.g. 02 Jun"}
              - {label: "Cover Image", name: "cover", widget: "image", required: false}
              - {label: "Target Group", name: "target_group", widget: "string", required: false}
              - {label: "Venue", name: "venue", widget: "string", required: false}
              - {label: "Status Label (e.g. Limited seats)", name: "status", widget: "string", required: false}
              - {label: "Button Text", name: "button_text", widget: "string", required: false}
              - {label: "Button Link", name: "button_link", widget: "string", required: false}
              - {label: "Description (HTML allowed)", name: "description", widget: "text"}
